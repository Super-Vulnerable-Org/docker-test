name: Build, Scan, Push

on:
  push:
  workflow_dispatch:

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t vuln-demo:${{ github.sha }} .

      - uses: o3security/gate-image@main
        with:
          server_url: https://api.o3.security
          api_key: ${{ secrets.O3_API_KEY }}
          image_name: vuln-demo:${{ github.sha }}
          scan_types: SCA,SECRET
          fail_on_policy: true

      - name: Push image
        run: echo "Gate passed — would docker push vuln-demo:${{ github.sha }}"
